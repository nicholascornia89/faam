o", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./FtVbBQmi.md\u0027\u003eTheodor W. Adorno\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eGerman philosopher, sociologist and theorist (1903\u20131969)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Theodor_W._Adorno.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "fnwvXE54", "label": "George Buchanan", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./fnwvXE54.md\u0027\u003eGeorge Buchanan\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eScottish historian and humanist scholar; (1506-1582)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Anonymous_-_George_Buchanan_(Se\u00f2ras_Bochanan),_1506_-_1582._Historian,_poet_and_reformer_-_PG_2678_-_National_Galleries_of_Scotland.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "MnwMVfio", "label": "Margaret Cavendish, Duchess of Newcastle-upon-Tyne", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./MnwMVfio.md\u0027\u003eMargaret Cavendish, Duchess of Newcastle-upon-Tyne\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eEnglish aristocrat, prolific writer, and scientist\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Margaret_Cavendish,_Duchess_of_Newcastle,_by_Peter_Lely.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "gKnQ6ydt", "label": "Hans Adolf Eduard Driesch", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./gKnQ6ydt.md\u0027\u003eHans Adolf Eduard Driesch\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eGerman philosopher and biologist (1867 - 1941)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Driesch1.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "5XQY3KU6", "label": "Alessandro Marcello", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./5XQY3KU6.md\u0027\u003eAlessandro Marcello\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eItalian composer\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Alessandro_Marcello.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "bKr8ng86", "label": "Jean Jacques Rousseau", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./bKr8ng86.md\u0027\u003eJean Jacques Rousseau\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eGenevan philosopher, writer, and composer (1712\u20131778)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Jean-Jacques_Rousseau_(painted_portrait).jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "Q2RWCMd8", "label": "Umberto Eco", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./Q2RWCMd8.md\u0027\u003eUmberto Eco\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eItalian semiotician, essayist, philosopher, literary critic, and novelist (1932\u20132016)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Italiaanse_schrijver_Umberto_Eco_,_kop,_Bestanddeelnr_932-9758.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "n3c9iRG3", "label": "R. G. Collingwood", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./n3c9iRG3.md\u0027\u003eR. G. Collingwood\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eBritish historian and philosopher (1889\u20131943)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Robin_G._Collingwood.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}]);
                  edges = new vis.DataSet([{"from": "YzjPcQbA", "to": "6pfzESag", "width": 10}, {"from": "7PzeiwdV", "to": "KKvERxRE", "width": 1}, {"from": "7PzeiwdV", "to": "6pfzESag", "width": 10}, {"from": "DXzCoxZU", "to": "6pfzESag", "width": 10}, {"from": "Yikf6B8p", "to": "6pfzESag", "width": 10}, {"from": "UnPqhMAn", "to": "6pfzESag", "width": 10}, {"from": "FtVbBQmi", "to": "6pfzESag", "width": 10}, {"from": "fnwvXE54", "to": "6pfzESag", "width": 10}, {"from": "KKvERxRE", "to": "6pfzESag", "width": 10}, {"from": "MnwMVfio", "to": "6pfzESag", "width": 10}, {"from": "gKnQ6ydt", "to": "6pfzESag", "width": 10}, {"from": "5XQY3KU6", "to": "6pfzESag", "width": 10}, {"from": "6pfzESag", "to": "bKr8ng86", "width": 10}, {"from": "6pfzESag", "to": "Q2RWCMd8", "width": 10}, {"from": "6pfzESag", "to": "n3c9iRG3", "width": 10}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
