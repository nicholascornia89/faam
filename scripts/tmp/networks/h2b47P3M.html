e \u003ca href=\u0027./DrGjSfwU.md\u0027\u003eforgery\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eprocess of making, adapting, or imitating objects, statistics, or documents with the intent to deceive\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "Mp2i2a2Q", "label": "Jacques Arcadelt", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./Mp2i2a2Q.md\u0027\u003eJacques Arcadelt\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eNetherlandish composer of the Renaissance\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Jarcadelt.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "3MHhcrj2", "label": "Pierre-Louis Dietsch", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./3MHhcrj2.md\u0027\u003ePierre-Louis Dietsch\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFrench composer and conductor (1808\u20131865)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Pierre-Louis_Dietsch_-_engraving_after_a_photo_by_Franck_-_Gallica.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "Noe7Aw8w", "label": "Henry Clough-Leighter", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./Noe7Aw8w.md\u0027\u003eHenry Clough-Leighter\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eAmerican composer and editor (1874-1956)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "jZ5Za9W2", "label": "Napol\u00e9on Joseph Ney", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./jZ5Za9W2.md\u0027\u003eNapol\u00e9on Joseph Ney\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFrench noble and politician (1803\u20131857)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Napol\u00e9on_Joseph_Ney_(1803-1857).jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "Y37RQzq9", "label": "Stephan L\u00fcck", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./Y37RQzq9.md\u0027\u003eStephan L\u00fcck\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003edom kapellmeister (1806\u20131883)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "PiHf7TsH", "label": "Johann Gottfried Ferrenberg", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./PiHf7TsH.md\u0027\u003eJohann Gottfried Ferrenberg\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eGerman musicologist and editor\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d63a19", "font": {"color": "#f8f7f4"}, "id": "a9ifUqK5", "label": "Messe \"Or-sus a coup\": f\u00fcr vier Singstimmen", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./a9ifUqK5.md\u0027\u003eMesse \"Or-sus a coup\": f\u00fcr vier Singstimmen\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003e\u003c/p\u003e\u003cimg src=\"../assets/images/thumbs/BSB-991077737379707356.gif\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#d63a19", "font": {"color": "#f8f7f4"}, "id": "Mdtc39Ji", "label": "Recueil des morceaux de musique ancienne : execut\u00e9s aux concerts de la Soci\u00e9te de musique vocale religieuse et classique fond\u00e9e a Paris en 1843 [...] sous la direction de Mr. le Prince de la Moskowa. [Deuxi\u00e8me volume, Nr 8-20]", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./Mdtc39Ji.md\u0027\u003eRecueil des morceaux de musique ancienne : execut\u00e9s aux concerts de la Soci\u00e9te de musique vocale religieuse et classique fond\u00e9e a Paris en 1843 [...] sous la direction de Mr. le Prince de la Moskowa. [Deuxi\u00e8me volume, Nr 8-20]\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003e\u003c/p\u003e\u003cimg src=\"../assets/images/thumbs/KMN-100549.gif\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#d63a19", "font": {"color": "#f8f7f4"}, "id": "S5RFKHbT", "label": "Sammlung ausgezeichneter Kompositionen f\u00fcr die Kirche", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./S5RFKHbT.md\u0027\u003eSammlung ausgezeichneter Kompositionen f\u00fcr die Kirche\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003e\u003c/p\u003e\u003cimg src=\"../assets/images/thumbs/SML-13885.gif\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}]);
                  edges = new vis.DataSet([{"from": "h2b47P3M", "to": "ik3NwdWW", "width": 10}, {"from": "h2b47P3M", "to": "7UGJWsQF", "width": 10}, {"from": "h2b47P3M", "to": "YJViDXyp", "width": 10}, {"from": "h2b47P3M", "to": "DrGjSfwU", "width": 10}, {"from": "h2b47P3M", "to": "Mp2i2a2Q", "width": 10}, {"from": "h2b47P3M", "to": "3MHhcrj2", "width": 10}, {"from": "h2b47P3M", "to": "Noe7Aw8w", "width": 10}, {"from": "h2b47P3M", "to": "jZ5Za9W2", "width": 10}, {"from": "h2b47P3M", "to": "Y37RQzq9", "width": 10}, {"from": "h2b47P3M", "to": "PiHf7TsH", "width": 10}, {"from": "h2b47P3M", "to": "a9ifUqK5", "width": 10}, {"from": "h2b47P3M", "to": "Mdtc39Ji", "width": 10}, {"from": "h2b47P3M", "to": "S5RFKHbT", "width": 10}, {"from": "ik3NwdWW", "to": "Mdtc39Ji", "width": 10}, {"from": "Mdtc39Ji", "to": "YJViDXyp", "width": 10}, {"from": "Mdtc39Ji", "to": "DrGjSfwU", "width": 10}, {"from": "YJViDXyp", "to": "a9ifUqK5", "width": 10}, {"from": "YJViDXyp", "to": "S5RFKHbT", "width": 1}, {"from": "DrGjSfwU", "to": "a9ifUqK5", "width": 10}, {"from": "DrGjSfwU", "to": "S5RFKHbT", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
