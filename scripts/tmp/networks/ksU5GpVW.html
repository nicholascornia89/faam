, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "fY3iiCZh", "label": "Adolf von Henselt", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./fY3iiCZh.md\u0027\u003eAdolf von Henselt\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eGerman composer and pianist (1814\u20131889)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Adolf_von_Henselt_-_portrait.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "HznvzWQP", "label": "Franz Xaver Haberl", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./HznvzWQP.md\u0027\u003eFranz Xaver Haberl\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eGerman priest and musicologist (1840\u20131910)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/FXHaberl.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "QrKgi8Ge", "label": "Franz Xaver Hammer", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./QrKgi8Ge.md\u0027\u003eFranz Xaver Hammer\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eGerman gambist, cellist and composer\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}]);
                  edges = new vis.DataSet([{"from": "hpHV6YiB", "to": "ksU5GpVW", "width": 10}, {"from": "Rnb5nj5c", "to": "ksU5GpVW", "width": 10}, {"from": "oQ39JUtd", "to": "ksU5GpVW", "width": 10}, {"from": "UJq8vYVd", "to": "ksU5GpVW", "width": 10}, {"from": "FM4yWajx", "to": "ksU5GpVW", "width": 10}, {"from": "WXLXgEpt", "to": "ksU5GpVW", "width": 10}, {"from": "kRmWfEhE", "to": "ksU5GpVW", "width": 10}, {"from": "2wKWtDR4", "to": "ksU5GpVW", "width": 10}, {"from": "RGdExgFa", "to": "ksU5GpVW", "width": 10}, {"from": "JR6gFKtX", "to": "ksU5GpVW", "width": 10}, {"from": "ksU5GpVW", "to": "fY3iiCZh", "width": 10}, {"from": "ksU5GpVW", "to": "HznvzWQP", "width": 10}, {"from": "ksU5GpVW", "to": "QrKgi8Ge", "width": 10}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
