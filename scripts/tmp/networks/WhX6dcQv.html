n\t\t\t", "value": "100"}, {"color": "#017cb1", "font": {"color": "#f8f7f4"}, "id": "QELJUJBf", "label": "church cantata", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./QELJUJBf.md\u0027\u003echurch cantata\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003etype of cantata intended to be performed during a liturgical service\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#017cb1", "font": {"color": "#f8f7f4"}, "id": "awRfkzzU", "label": "basso continuo", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./awRfkzzU.md\u0027\u003ebasso continuo\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003etechnique of improvisation and accompaniment, common in Baroque music\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#017cb1", "font": {"color": "#f8f7f4"}, "id": "ePSpfWmF", "label": "figured bass", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./ePSpfWmF.md\u0027\u003efigured bass\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003emusical notation in which numerals/accidentals show chords to be played in relation to the bass note, used in Baroque music\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "NFAxdnVA", "label": "voice", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./NFAxdnVA.md\u0027\u003evoice\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ehuman voice as musical instrument\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "k59fQ7su", "label": "continuo group", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./k59fQ7su.md\u0027\u003econtinuo group\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eone or more instruments that improvise an accompaniment from a written bass line, typical in baroque music\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}]);
                  edges = new vis.DataSet([{"from": "Gx3B7DJH", "to": "WhX6dcQv", "width": 1}, {"from": "PprjdkHE", "to": "WhX6dcQv", "width": 1}, {"from": "2qoBxv5j", "to": "WhX6dcQv", "width": 1}, {"from": "UMravioT", "to": "WhX6dcQv", "width": 1}, {"from": "TUdHPWU8", "to": "WhX6dcQv", "width": 1}, {"from": "U7DY6oXy", "to": "WhX6dcQv", "width": 1}, {"from": "nhyHiCdi", "to": "Uf655iQV", "width": 1}, {"from": "nhyHiCdi", "to": "WhX6dcQv", "width": 1}, {"from": "QELJUJBf", "to": "Uf655iQV", "width": 1}, {"from": "QELJUJBf", "to": "WhX6dcQv", "width": 1}, {"from": "awRfkzzU", "to": "WhX6dcQv", "width": 1}, {"from": "Uf655iQV", "to": "WhX6dcQv", "width": 1}, {"from": "WhX6dcQv", "to": "ePSpfWmF", "width": 1}, {"from": "WhX6dcQv", "to": "NFAxdnVA", "width": 1}, {"from": "WhX6dcQv", "to": "k59fQ7su", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
