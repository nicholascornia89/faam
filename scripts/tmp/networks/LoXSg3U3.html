d63a19", "font": {"color": "#f8f7f4"}, "id": "5xamdHPx", "label": "Pot-pourri : En B fa si [pour piano]", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./5xamdHPx.md\u0027\u003ePot-pourri : En B fa si [pour piano]\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003e\u003c/p\u003e\u003cimg src=\"../assets/images/thumbs/KCG-000329752.gif\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#d63a19", "font": {"color": "#f8f7f4"}, "id": "nJai3Wij", "label": "Six Sonatas : for the Harpsichord or Piano Forte with an Accompanyment for a German Fl\u00fbte or Violin : Op. II", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./nJai3Wij.md\u0027\u003eSix Sonatas : for the Harpsichord or Piano Forte with an Accompanyment for a German Fl\u00fbte or Violin : Op. II\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003e\u003c/p\u003e\u003cimg src=\"../assets/images/thumbs/KCG-000339708.gif\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#d63a19", "font": {"color": "#f8f7f4"}, "id": "Hyve2CJo", "label": "Ouverture d\u0027Iphigenie [en Aulide] : Arrang\u00e9e pour clavecin ou forte-piano", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./Hyve2CJo.md\u0027\u003eOuverture d\u0027Iphigenie [en Aulide] : Arrang\u00e9e pour clavecin ou forte-piano\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003e\u003c/p\u003e\u003cimg src=\"../assets/images/thumbs/ORP-26137450b.gif\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#d63a19", "font": {"color": "#f8f7f4"}, "id": "Zjww66hb", "label": "Temp\u00eate d\u0027Iphig\u00e9nie en Tauride : Avec les Airs de Ballet De M. le Chevalier Gluck En Quatuor : Arrang\u00e9e pour le Clavecin, ou le Forte Piano, Avec Accompagnement, de Violon Alto, et Violoncelle, Ad Libitum", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./Zjww66hb.md\u0027\u003eTemp\u00eate d\u0027Iphig\u00e9nie en Tauride : Avec les Airs de Ballet De M. le Chevalier Gluck En Quatuor : Arrang\u00e9e pour le Clavecin, ou le Forte Piano, Avec Accompagnement, de Violon Alto, et Violoncelle, Ad Libitum\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003e\u003c/p\u003e\u003cimg src=\"../assets/images/thumbs/KCG-000345536.gif\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#d63a19", "font": {"color": "#f8f7f4"}, "id": "bPMh4UBw", "label": "Convoluut", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./bPMh4UBw.md\u0027\u003eConvoluut\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003e\u003c/p\u003e\u003cimg src=\"../assets/images/thumbs/KCA-030902808952.gif\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}]);
                  edges = new vis.DataSet([{"from": "LLpPqfa8", "to": "LoXSg3U3", "width": 10}, {"from": "LLpPqfa8", "to": "PyGNLcfw", "width": 10}, {"from": "8XRHbdbi", "to": "PyGNLcfw", "width": 10}, {"from": "8XRHbdbi", "to": "LoXSg3U3", "width": 10}, {"from": "E2Sb746q", "to": "LoXSg3U3", "width": 10}, {"from": "U4gmyGDo", "to": "LoXSg3U3", "width": 10}, {"from": "dek3dK5z", "to": "LoXSg3U3", "width": 10}, {"from": "LoXSg3U3", "to": "PyGNLcfw", "width": 10}, {"from": "LoXSg3U3", "to": "5xamdHPx", "width": 10}, {"from": "LoXSg3U3", "to": "nJai3Wij", "width": 10}, {"from": "LoXSg3U3", "to": "Hyve2CJo", "width": 10}, {"from": "LoXSg3U3", "to": "Zjww66hb", "width": 10}, {"from": "LoXSg3U3", "to": "bPMh4UBw", "width": 10}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
