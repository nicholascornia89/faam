: "#f8f7f4"}, "id": "48HdoPx6", "label": "Minuet vari\u00e9", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./48HdoPx6.md\u0027\u003eMinuet vari\u00e9\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003e\u003c/p\u003e\u003cimg src=\"../assets/images/thumbs/KCA-030904499602.gif\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#017cb1", "font": {"color": "#f8f7f4"}, "id": "fCPKhUxw", "label": "piano music", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./fCPKhUxw.md\u0027\u003epiano music\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003emusical form/genre\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#017cb1", "font": {"color": "#f8f7f4"}, "id": "7TEgqthc", "label": "minuet", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./7TEgqthc.md\u0027\u003eminuet\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFrench folk dance, which over time became a court dance, in 3/4 meter and moderate tempo\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "PyGNLcfw", "label": "piano", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./PyGNLcfw.md\u0027\u003epiano\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003emusical keyboard instrument\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}]);
                  edges = new vis.DataSet([{"from": "LG6Ykj8w", "to": "6fQyHcwz", "width": 1}, {"from": "LG6Ykj8w", "to": "GpNEm7nw", "width": 1}, {"from": "LG6Ykj8w", "to": "LQE77nqs", "width": 1}, {"from": "LG6Ykj8w", "to": "7WfWytMV", "width": 1}, {"from": "LG6Ykj8w", "to": "kxAqh9HR", "width": 1}, {"from": "LG6Ykj8w", "to": "gb6MiJbD", "width": 1}, {"from": "LG6Ykj8w", "to": "eNyFmkHC", "width": 1}, {"from": "LG6Ykj8w", "to": "2C9Fy8H6", "width": 1}, {"from": "LG6Ykj8w", "to": "48HdoPx6", "width": 1}, {"from": "LG6Ykj8w", "to": "fCPKhUxw", "width": 1}, {"from": "LG6Ykj8w", "to": "7TEgqthc", "width": 1}, {"from": "LG6Ykj8w", "to": "PyGNLcfw", "width": 1}, {"from": "GpNEm7nw", "to": "48HdoPx6", "width": 1}, {"from": "7TEgqthc", "to": "48HdoPx6", "width": 1}, {"from": "LQE77nqs", "to": "48HdoPx6", "width": 1}, {"from": "48HdoPx6", "to": "6fQyHcwz", "width": 1}, {"from": "48HdoPx6", "to": "7WfWytMV", "width": 1}, {"from": "48HdoPx6", "to": "kxAqh9HR", "width": 1}, {"from": "48HdoPx6", "to": "gb6MiJbD", "width": 1}, {"from": "48HdoPx6", "to": "eNyFmkHC", "width": 1}, {"from": "48HdoPx6", "to": "2C9Fy8H6", "width": 1}, {"from": "48HdoPx6", "to": "fCPKhUxw", "width": 1}, {"from": "48HdoPx6", "to": "PyGNLcfw", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
