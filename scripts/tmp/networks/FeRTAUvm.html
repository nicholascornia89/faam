                  edges = new vis.DataSet([{"from": "BzWe9XnY", "to": "3Ho9ctKq", "width": 1}, {"from": "BzWe9XnY", "to": "FeRTAUvm", "width": 1}, {"from": "3Ho9ctKq", "to": "LUkcy3mi", "width": 1}, {"from": "3Ho9ctKq", "to": "FeRTAUvm", "width": 1}, {"from": "93XWfcVS", "to": "FeRTAUvm", "width": 1}, {"from": "93XWfcVS", "to": "aJeJBesD", "width": 10}, {"from": "93XWfcVS", "to": "5aTYuVxp", "width": 1}, {"from": "93XWfcVS", "to": "TFAYYcQp", "width": 1}, {"from": "93XWfcVS", "to": "ku2dT5kg", "width": 10}, {"from": "93XWfcVS", "to": "MVLRXXFR", "width": 1}, {"from": "5aTYuVxp", "to": "G4co3etX", "width": 1}, {"from": "5aTYuVxp", "to": "jzsis3MS", "width": 1}, {"from": "5aTYuVxp", "to": "FeRTAUvm", "width": 1}, {"from": "5aTYuVxp", "to": "kypLEwJs", "width": 1}, {"from": "Tj5k8Dah", "to": "FeRTAUvm", "width": 1}, {"from": "aJeJBesD", "to": "G4co3etX", "width": 1}, {"from": "aJeJBesD", "to": "jzsis3MS", "width": 1}, {"from": "aJeJBesD", "to": "FeRTAUvm", "width": 1}, {"from": "aJeJBesD", "to": "kypLEwJs", "width": 10}, {"from": "iEzw8EiF", "to": "FeRTAUvm", "width": 1}, {"from": "kypLEwJs", "to": "FeRTAUvm", "width": 1}, {"from": "kypLEwJs", "to": "TFAYYcQp", "width": 1}, {"from": "kypLEwJs", "to": "ku2dT5kg", "width": 10}, {"from": "kypLEwJs", "to": "MVLRXXFR", "width": 1}, {"from": "MVLRXXFR", "to": "FeRTAUvm", "width": 1}, {"from": "ku2dT5kg", "to": "G4co3etX", "width": 1}, {"from": "ku2dT5kg", "to": "jzsis3MS", "width": 1}, {"from": "ku2dT5kg", "to": "FeRTAUvm", "width": 1}, {"from": "4oKtB5xy", "to": "FeRTAUvm", "width": 1}, {"from": "LUkcy3mi", "to": "FeRTAUvm", "width": 1}, {"from": "G4co3etX", "to": "FeRTAUvm", "width": 1}, {"from": "jzsis3MS", "to": "FeRTAUvm", "width": 1}, {"from": "TFAYYcQp", "to": "FeRTAUvm", "width": 1}]);

                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
