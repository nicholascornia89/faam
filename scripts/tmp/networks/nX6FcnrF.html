the pope between 756\u20131870\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#8b9a66", "font": {"color": "#f8f7f4"}, "id": "NbmmLYHK", "label": "First French Empire", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./NbmmLYHK.md\u0027\u003eFirst French Empire\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eempire of Napoleon I of France, from 1804 to 1815\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#8b9a66", "font": {"color": "#f8f7f4"}, "id": "WN5PAeAx", "label": "Kingdom of Prussia", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./WN5PAeAx.md\u0027\u003eKingdom of Prussia\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eformer European state (1701\u20131918), part of the German Empire after 1871\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "MBofjcoj", "label": "Nicola Sala", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./MBofjcoj.md\u0027\u003eNicola Sala\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eItalian opera composer and music theorist (1713-1801)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/NicolaSala.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "TbGCra4a", "label": "conservatory", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./TbGCra4a.md\u0027\u003econservatory\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eeducational institution specialized in the study, training and research of music\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}]);
                  edges = new vis.DataSet([{"from": "bqGtGe4z", "to": "nX6FcnrF", "width": 1}, {"from": "G8tgNnWV", "to": "nX6FcnrF", "width": 1}, {"from": "nX6FcnrF", "to": "aJeJBesD", "width": 10}, {"from": "nX6FcnrF", "to": "5aTYuVxp", "width": 1}, {"from": "nX6FcnrF", "to": "TDF2knmi", "width": 1}, {"from": "nX6FcnrF", "to": "FicTBGBH", "width": 1}, {"from": "nX6FcnrF", "to": "ku2dT5kg", "width": 10}, {"from": "nX6FcnrF", "to": "Bk3pdD3B", "width": 1}, {"from": "nX6FcnrF", "to": "NbmmLYHK", "width": 1}, {"from": "nX6FcnrF", "to": "WN5PAeAx", "width": 1}, {"from": "nX6FcnrF", "to": "MBofjcoj", "width": 1}, {"from": "nX6FcnrF", "to": "TbGCra4a", "width": 1}, {"from": "5aTYuVxp", "to": "MBofjcoj", "width": 1}, {"from": "aJeJBesD", "to": "MBofjcoj", "width": 10}, {"from": "ku2dT5kg", "to": "MBofjcoj", "width": 10}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
