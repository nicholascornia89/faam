": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./VTbpLdWs.md\u0027\u003eMordano\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eItalian comune\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "GNcY5wsD", "label": "San Pietro a Majella Conservatory of Music", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./GNcY5wsD.md\u0027\u003eSan Pietro a Majella Conservatory of Music\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003emusic high school\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "4WnKmdH2", "label": "Salomon Jadassohn", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./4WnKmdH2.md\u0027\u003eSalomon Jadassohn\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eGerman composer (1831\u20131902)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "ZKbQcxUJ", "label": "Paolo Serrao", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./ZKbQcxUJ.md\u0027\u003ePaolo Serrao\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eItalian musician (1830-1907)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#fffef6", "font": {"color": "#f8f7f4"}, "id": "49CMncTw", "label": "musicologist", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./49CMncTw.md\u0027\u003emusicologist\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eperson who studies music as a branch of knowledge or field of research as distinct from composition or performance\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "20"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "QSaAmDt9", "label": "Philharmonic Academy of Bologna", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./QSaAmDt9.md\u0027\u003ePhilharmonic Academy of Bologna\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eorganization\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}]);
                  edges = new vis.DataSet([{"from": "Fkfrx6rD", "to": "Y32iiyWF", "width": 1}, {"from": "Fkfrx6rD", "to": "KhgLimM7", "width": 1}, {"from": "MxnLw4ay", "to": "Y32iiyWF", "width": 1}, {"from": "MxnLw4ay", "to": "KhgLimM7", "width": 1}, {"from": "GBEySAxU", "to": "aJeJBesD", "width": 1}, {"from": "GBEySAxU", "to": "5aTYuVxp", "width": 1}, {"from": "GBEySAxU", "to": "ku2dT5kg", "width": 1}, {"from": "GBEySAxU", "to": "KhgLimM7", "width": 1}, {"from": "VTbpLdWs", "to": "KhgLimM7", "width": 1}, {"from": "GNcY5wsD", "to": "KhgLimM7", "width": 1}, {"from": "5aTYuVxp", "to": "KhgLimM7", "width": 1}, {"from": "4WnKmdH2", "to": "KhgLimM7", "width": 10}, {"from": "4WnKmdH2", "to": "aJeJBesD", "width": 10}, {"from": "4WnKmdH2", "to": "ku2dT5kg", "width": 10}, {"from": "aJeJBesD", "to": "Y32iiyWF", "width": 1}, {"from": "aJeJBesD", "to": "KhgLimM7", "width": 1}, {"from": "aJeJBesD", "to": "ZKbQcxUJ", "width": 1}, {"from": "KhgLimM7", "to": "Y32iiyWF", "width": 1}, {"from": "KhgLimM7", "to": "49CMncTw", "width": 1}, {"from": "KhgLimM7", "to": "ku2dT5kg", "width": 1}, {"from": "KhgLimM7", "to": "ZKbQcxUJ", "width": 10}, {"from": "KhgLimM7", "to": "QSaAmDt9", "width": 1}, {"from": "ku2dT5kg", "to": "Y32iiyWF", "width": 1}, {"from": "ku2dT5kg", "to": "ZKbQcxUJ", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
