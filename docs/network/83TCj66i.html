fvG", "label": "organ builder", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./8tGGAfvG.md\u0027\u003eorgan builder\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eprofession that designs, builds, and maintains pipe organs\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "20"}, {"color": "#fffef6", "font": {"color": "#f8f7f4"}, "id": "ZhptKYF3", "label": "organist", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./ZhptKYF3.md\u0027\u003eorganist\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003emusician who plays any type of organ\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "20"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "8cygiHEB", "label": "organ", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./8cygiHEB.md\u0027\u003eorgan\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003emusical keyboard instrument\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}]);
                  edges = new vis.DataSet([{"from": "aWsBkMZ6", "to": "aJeJBesD", "width": 1}, {"from": "aWsBkMZ6", "to": "TDF2knmi", "width": 1}, {"from": "aWsBkMZ6", "to": "ku2dT5kg", "width": 1}, {"from": "aWsBkMZ6", "to": "KWjNoJvm", "width": 1}, {"from": "aWsBkMZ6", "to": "83TCj66i", "width": 1}, {"from": "bse8XyJQ", "to": "83TCj66i", "width": 10}, {"from": "bse8XyJQ", "to": "aJeJBesD", "width": 10}, {"from": "bse8XyJQ", "to": "ku2dT5kg", "width": 10}, {"from": "aJeJBesD", "to": "83TCj66i", "width": 1}, {"from": "aJeJBesD", "to": "GsCdFckm", "width": 10}, {"from": "aJeJBesD", "to": "383CM2RQ", "width": 10}, {"from": "aJeJBesD", "to": "NtfUK4LJ", "width": 10}, {"from": "aJeJBesD", "to": "2pCqJqh6", "width": 10}, {"from": "GsCdFckm", "to": "83TCj66i", "width": 10}, {"from": "GsCdFckm", "to": "ku2dT5kg", "width": 10}, {"from": "aqJiouEX", "to": "83TCj66i", "width": 1}, {"from": "KWjNoJvm", "to": "83TCj66i", "width": 1}, {"from": "83TCj66i", "to": "8tGGAfvG", "width": 1}, {"from": "83TCj66i", "to": "TDF2knmi", "width": 1}, {"from": "83TCj66i", "to": "ZhptKYF3", "width": 1}, {"from": "83TCj66i", "to": "ku2dT5kg", "width": 1}, {"from": "83TCj66i", "to": "8cygiHEB", "width": 1}, {"from": "83TCj66i", "to": "383CM2RQ", "width": 10}, {"from": "83TCj66i", "to": "NtfUK4LJ", "width": 10}, {"from": "83TCj66i", "to": "2pCqJqh6", "width": 10}, {"from": "ku2dT5kg", "to": "383CM2RQ", "width": 10}, {"from": "ku2dT5kg", "to": "NtfUK4LJ", "width": 10}, {"from": "ku2dT5kg", "to": "2pCqJqh6", "width": 10}]);

                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
