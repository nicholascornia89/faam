3ca href=\u0027./ku2dT5kg.md\u0027\u003emale\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eto be used in \"sex or gender\" (P21) to indicate that the human subject is a male or \"semantic gender\" (P10339) to indicate that a word refers to a male person\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#8b9a66", "font": {"color": "#f8f7f4"}, "id": "eYiHyUu4", "label": "Republic of Venice", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./eYiHyUu4.md\u0027\u003eRepublic of Venice\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eformer state in Northeastern Italy (697\u20131797)\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#fffef6", "font": {"color": "#f8f7f4"}, "id": "ZhptKYF3", "label": "organist", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./ZhptKYF3.md\u0027\u003eorganist\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003emusician who plays any type of organ\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "20"}]);
                  edges = new vis.DataSet([{"from": "CgZzMq22", "to": "K79S8mEL", "width": 1}, {"from": "CgZzMq22", "to": "6L9tixhA", "width": 1}, {"from": "8cygiHEB", "to": "Ztsjgg35", "width": 1}, {"from": "8cygiHEB", "to": "K79S8mEL", "width": 1}, {"from": "8cygiHEB", "to": "6L9tixhA", "width": 1}, {"from": "5aTYuVxp", "to": "kkHrN3TP", "width": 1}, {"from": "5aTYuVxp", "to": "Ztsjgg35", "width": 1}, {"from": "5aTYuVxp", "to": "K79S8mEL", "width": 1}, {"from": "5aTYuVxp", "to": "6L9tixhA", "width": 1}, {"from": "aJeJBesD", "to": "kkHrN3TP", "width": 1}, {"from": "aJeJBesD", "to": "Ztsjgg35", "width": 1}, {"from": "aJeJBesD", "to": "K79S8mEL", "width": 1}, {"from": "aJeJBesD", "to": "6L9tixhA", "width": 1}, {"from": "Ztsjgg35", "to": "ku2dT5kg", "width": 1}, {"from": "Ztsjgg35", "to": "6L9tixhA", "width": 1}, {"from": "ku2dT5kg", "to": "kkHrN3TP", "width": 1}, {"from": "ku2dT5kg", "to": "K79S8mEL", "width": 1}, {"from": "ku2dT5kg", "to": "6L9tixhA", "width": 1}, {"from": "eYiHyUu4", "to": "K79S8mEL", "width": 1}, {"from": "eYiHyUu4", "to": "6L9tixhA", "width": 1}, {"from": "ZhptKYF3", "to": "K79S8mEL", "width": 1}, {"from": "ZhptKYF3", "to": "6L9tixhA", "width": 1}, {"from": "K79S8mEL", "to": "kkHrN3TP", "width": 1}, {"from": "K79S8mEL", "to": "6L9tixhA", "width": 1}, {"from": "6L9tixhA", "to": "kkHrN3TP", "width": 1}]);

                  nodeColors = {};

                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
