udina\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eSoviet pianist\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Maria_Yudina.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "D6jgxFyi", "label": "Dmitri Shostakovich", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./D6jgxFyi.md\u0027\u003eDmitri Shostakovich\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eSoviet composer and pianist (1906-1975)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Dmitri_Shostakovich_credit_Deutsche_Fotothek_adjusted.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "FVjZrbAX", "label": "Meyerhold State Theatre", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./FVjZrbAX.md\u0027\u003eMeyerhold State Theatre\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003etheatre in Moscow (1920\u20131938)\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "7FTvdvo6", "label": "Karl Davydov", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./7FTvdvo6.md\u0027\u003eKarl Davydov\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eRussian composer (1838\u20131889)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Davidov-Karl.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "jKKzbBBu", "label": "Workers\u0027 Youth Theatre", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./jKKzbBBu.md\u0027\u003eWorkers\u0027 Youth Theatre\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eSoviet theatre type\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#8b9a66", "font": {"color": "#f8f7f4"}, "id": "3iEGZFo6", "label": "Russia", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./3iEGZFo6.md\u0027\u003eRussia\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ecountry in Eastern Europe and Northern Asia\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}]);
                  edges = new vis.DataSet([{"from": "G5rs66Rg", "to": "EFwVuC3c", "width": 1}, {"from": "G5rs66Rg", "to": "diUttN86", "width": 10}, {"from": "Dp6ZykXE", "to": "diUttN86", "width": 10}, {"from": "5KHPgpw3", "to": "2J9rMsu5", "width": 1}, {"from": "5KHPgpw3", "to": "diUttN86", "width": 10}, {"from": "6gEAtDi5", "to": "diUttN86", "width": 10}, {"from": "EFwVuC3c", "to": "2J9rMsu5", "width": 1}, {"from": "EFwVuC3c", "to": "diUttN86", "width": 10}, {"from": "96zMohM3", "to": "D6jgxFyi", "width": 1}, {"from": "96zMohM3", "to": "diUttN86", "width": 10}, {"from": "FVjZrbAX", "to": "diUttN86", "width": 10}, {"from": "FVjZrbAX", "to": "D6jgxFyi", "width": 10}, {"from": "7FTvdvo6", "to": "diUttN86", "width": 10}, {"from": "2J9rMsu5", "to": "diUttN86", "width": 10}, {"from": "D6jgxFyi", "to": "diUttN86", "width": 10}, {"from": "D6jgxFyi", "to": "jKKzbBBu", "width": 1}, {"from": "3iEGZFo6", "to": "diUttN86", "width": 10}, {"from": "jKKzbBBu", "to": "diUttN86", "width": 10}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
