": "DUO BRILLANT: compos\u00e9 sur les motifs de la Sonnambule de Bellini/par J. Benedict \u0026 C. De B\u00e9riot;arrang\u00e9 pour fl\u00fbte et piano par Tulou. : Voor fluit en piano.", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./QxFSEUST.md\u0027\u003eDUO BRILLANT: compos\u00e9 sur les motifs de la Sonnambule de Bellini/par J. Benedict \u0026 C. De B\u00e9riot;arrang\u00e9 pour fl\u00fbte et piano par Tulou. : Voor fluit en piano.\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003e\u003c/p\u003e\u003cimg src=\"../assets/images/thumbs/KCG-000333995.gif\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#d63a19", "font": {"color": "#f8f7f4"}, "id": "5bi6fc4k", "label": "Six \u00e9tudes brillantes pour le violon avec accompagnement de piano ad libitum, op. 17", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./5bi6fc4k.md\u0027\u003eSix \u00e9tudes brillantes pour le violon avec accompagnement de piano ad libitum, op. 17\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003e\u003c/p\u003e\u003cimg src=\"../assets/images/thumbs/BNF-42846644p.gif\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}]);
                  edges = new vis.DataSet([{"from": "mWsvgkqP", "to": "TWwN9yoM", "width": 10}, {"from": "oMERLdSN", "to": "TWwN9yoM", "width": 10}, {"from": "fxtj72S3", "to": "TWwN9yoM", "width": 10}, {"from": "4AMPVsN8", "to": "TWwN9yoM", "width": 10}, {"from": "JoDhf5R4", "to": "TWwN9yoM", "width": 10}, {"from": "Qsf8EayK", "to": "TWwN9yoM", "width": 10}, {"from": "7StSgcq9", "to": "TWwN9yoM", "width": 10}, {"from": "AWoQ5Jp7", "to": "TWwN9yoM", "width": 10}, {"from": "TWwN9yoM", "to": "iuZeuibY", "width": 10}, {"from": "TWwN9yoM", "to": "6m3ZbnrF", "width": 10}, {"from": "TWwN9yoM", "to": "YvQmwaaW", "width": 10}, {"from": "TWwN9yoM", "to": "QxFSEUST", "width": 10}, {"from": "TWwN9yoM", "to": "5bi6fc4k", "width": 10}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
