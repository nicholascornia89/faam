              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "aSUzkyiR", "label": "Pierre Maleden", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./aSUzkyiR.md\u0027\u003ePierre Maleden\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFrench composer, musicologist and music teacher\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "FTz4No8B", "label": "Gustave Lef\u00e8vre", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./FTz4No8B.md\u0027\u003eGustave Lef\u00e8vre\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFrench composer (1831\u20131910)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Portraitlefevre.png\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#017cb1", "font": {"color": "#f8f7f4"}, "id": "aJeJBesD", "label": "human", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./aJeJBesD.md\u0027\u003ehuman\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eany single member of Homo sapiens, unique extant species of the genus Homo\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#017cb1", "font": {"color": "#f8f7f4"}, "id": "ku2dT5kg", "label": "male", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./ku2dT5kg.md\u0027\u003emale\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eto be used in \"sex or gender\" (P21) to indicate that the human subject is a male or \"semantic gender\" (P10339) to indicate that a word refers to a male person\u003c/p\u003e\u003 olor": "#f8f7f4"}, "id": "GsCCwH8o", "label": "Gabriel Faur\u00e9", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./GsCCwH8o.md\u0027\u003eGabriel Faur\u00e9\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFrench composer, organist, pianist and teacher (1845\u20131924)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Faur\u00e9Pirou1905.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#8b9a66", "font": {"color": "#f8f7f4"}, "id": "cUWLRRms", "label": "Boulogne-Billancourt", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./cUWLRRms.md\u0027\u003eBoulogne-Billancourt\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFrench commune in Hauts-de-Seine, \u00cele-de-France\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#8b9a66", "font": {"color": "#f8f7f4"}, "id": "BJqUa5Kf", "label": "France", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./BJqUa5Kf.md\u0027\u003eFrance\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ecountry in Western Europe and other continents (through its overseas territories in America, Africa and Oceania)\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#8b9a66", "font": {"color": "#f8f7f4"}, "id": "YQ5AKxXL", "label": "Provins", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./YQ5AKxXL.md\u0027\u003eProvins\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ecommune in Seine-et-Marne, France\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}]);
                  edges = new vis.DataSet([{"from": "aSUzkyiR", "to": "FTz4No8B", "width": 10}, {"from": "aSUzkyiR", "to": "aJeJBesD", "width": 10}, {"from": "aSUzkyiR", "to": "ku2dT5kg", "width": 10}, {"from": "AnuyMmYL", "to": "FTz4No8B", "width": 10}, {"from": "AnuyMmYL", "to": "aJeJBesD", "width": 10}, {"from": "AnuyMmYL", "to": "ku2dT5kg", "width": 10}, {"from": "L7DPWnnr", "to": "LjTkQJnC", "width": 1}, {"from": "L7DPWnnr", "to": "FTz4No8B", "width": 1}, {"from": "5aTYuVxp", "to": "GsCCwH8o", "width": 1}, {"from": "5aTYuVxp", "to": "LjTkQJnC", "width": 1}, {"from": "5aTYuVxp", "to": "FTz4No8B", "width": 1}, {"from": "aJeJBesD", "to": "GsCCwH8o", "width": 1}, {"from": "aJeJBesD", "to": "LjTkQJnC", "width": 1}, {"from": "aJeJBesD", "to": "FTz4No8B", "width": 1}, {"from": "cUWLRRms", "to": "BJqUa5Kf", "width": 1}, {"from": "cUWLRRms", "to": "FTz4No8B", "width": 1}, {"from": "BJqUa5Kf", "to": "YQ5AKxXL", "width": 1}, {"from": "BJqUa5Kf", "to": "GsCCwH8o", "width": 1}, {"from": "BJqUa5Kf", "to": "LjTkQJnC", "width": 1}, {"from": "BJqUa5Kf", "to": "FTz4No8B", "width": 1}, {"from": "LjTkQJnC", "to": "ku2dT5kg", "width": 1}, {"from": "LjTkQJnC", "to": "FTz4No8B", "width": 1}, {"from": "ku2dT5kg", "to": "GsCCwH8o", "width": 1}, {"from": "ku2dT5kg", "to": "FTz4No8B", "width": 1}, {"from": "GsCCwH8o", "to": "FTz4No8B", "width": 1}, {"from": "FTz4No8B", "to": "YQ5AKxXL", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
