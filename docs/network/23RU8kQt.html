                 position:absolute;
                 top:0px;
                 left:0px;
                 display:none;
                 background-color:#f5f4ed;
                 -moz-border-radius: 3px;

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "ChZT6NPF", "label": "J\u00f3zef Elsner", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./ChZT6NPF.md\u0027\u003eJ\u00f3zef Elsner\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ePolish composer and conductor\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/J\u00f3zef_Elsner.PNG\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "8EpC6dQ6", "label": "Fr\u00e9d\u00e9ric Chopin", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./8EpC6dQ6.md\u0027\u003eFr\u00e9d\u00e9ric Chopin\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ePolish composer and pianist (1810\u20131849)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Frederic_Chopin_photo.jpeg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#8b9a66", "font": {"color": "#f8f7f4"}, "id": "44272D3z", "label": "Warsaw", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./44272D3z.md\u0027\u003eWarsaw\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ecapital and largest city of Poland\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "23RU8kQt", "label": "Chopin University of Music", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./23RU8kQt.md\u0027\u003eChopin University of Music\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ePolish university of music\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#8b9a66", "font": {"color": "#f8f7f4"}, "id": "CGf6bUWt", "label": "Poland", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./CGf6bUWt.md\u0027\u003ePoland\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ecountry in Central Europe\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "hmD8cQGZ", "label": "Elisabeth Chojnacka", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./hmD8cQGZ.md\u0027\u003eElisabeth Chojnacka\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ePolish harpsichordist (1939\u20132017)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Elisabeth_CHOJNACKA_1972.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "ANygk75M", "label": "Wanda Landowska", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./ANygk75M.md\u0027\u003eWanda Landowska\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003e(1879-1959) Polish-French harpsichordist\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/https://upload.wikimedia.org/wikipedia/commons/7/78/Wanda_Landowska_%281879-1959%29_portrait.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "jeeeKFQ8", "label": "Stanis\u0142aw Moniuszko", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./jeeeKFQ8.md\u0027\u003eStanis\u0142aw Moniuszko\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ePolish composer (1819\u20131872)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Stanis\u0142a\u016d_Maniu\u0161ka._\u0421\u0442\u0430\u043d\u0456\u0441\u043b\u0430\u045e_\u041c\u0430\u043d\u044e\u0448\u043a\u0430_(T._Maleszewski,_1865).jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "JHkVzjNY", "label": "Wilhelm W\u00fcrfel", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./JHkVzjNY.md\u0027\u003eWilhelm W\u00fcrfel\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eCzech conductor, music educator, composer and pianist (1790\u20131832)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}]);
                  edges = new vis.DataSet([{"from": "ChZT6NPF", "to": "8EpC6dQ6", "width": 1}, {"from": "ChZT6NPF", "to": "44272D3z", "width": 1}, {"from": "ChZT6NPF", "to": "23RU8kQt", "width": 1}, {"from": "44272D3z", "to": "CGf6bUWt", "width": 1}, {"from": "44272D3z", "to": "23RU8kQt", "width": 1}, {"from": "44272D3z", "to": "hmD8cQGZ", "width": 1}, {"from": "44272D3z", "to": "ANygk75M", "width": 1}, {"from": "44272D3z", "to": "jeeeKFQ8", "width": 1}, {"from": "hmD8cQGZ", "to": "CGf6bUWt", "width": 1}, {"from": "hmD8cQGZ", "to": "23RU8kQt", "width": 1}, {"from": "8EpC6dQ6", "to": "CGf6bUWt", "width": 1}, {"from": "8EpC6dQ6", "to": "JHkVzjNY", "width": 1}, {"from": "8EpC6dQ6", "to": "23RU8kQt", "width": 10}, {"from": "JHkVzjNY", "to": "23RU8kQt", "width": 10}, {"from": "CGf6bUWt", "to": "23RU8kQt", "width": 1}, {"from": "CGf6bUWt", "to": "jeeeKFQ8", "width": 1}, {"from": "jeeeKFQ8", "to": "23RU8kQt", "width": 1}, {"from": "23RU8kQt", "to": "ANygk75M", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": true}, "smooth": false}, "physics": {"barnesHut": {"gravitationalConstant": -120050}, "minVelocity": 0.75}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
        </script>
