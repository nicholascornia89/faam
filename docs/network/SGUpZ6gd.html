zrCv", "label": "Estienne Roger", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./dWs3zrCv.md\u0027\u003eEstienne Roger\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFrench-Dutch printer and publisher\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/1715_Renneville,_L\u2019Inquisition_Fran\u00e7oise.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "7PzeiwdV", "label": "Pierre Gassendi", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./7PzeiwdV.md\u0027\u003ePierre Gassendi\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFrench philosopher, astronomer, mathematician, priest, and scientist (*1592 \u2013 \u20201655)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/PierreGassendi.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "5viEvD6v", "label": "Johannes Ockeghem", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027./5viEvD6v.md\u0027\u003eJohannes Ockeghem\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFranco-Flemish composer\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Anonymous_-_Portrait_of_a_Musician,_64.54.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}]);
                  edges = new vis.DataSet([{"from": "aR29uPAQ", "to": "SGUpZ6gd", "width": 10}, {"from": "SGUpZ6gd", "to": "RFNnzUS7", "width": 1}, {"from": "SGUpZ6gd", "to": "Co2QwDri", "width": 10}, {"from": "SGUpZ6gd", "to": "P7Ctb5h9", "width": 10}, {"from": "SGUpZ6gd", "to": "KKvERxRE", "width": 10}, {"from": "SGUpZ6gd", "to": "GQdzFiB9", "width": 10}, {"from": "SGUpZ6gd", "to": "gPM2JN4P", "width": 10}, {"from": "SGUpZ6gd", "to": "gEEWrzco", "width": 10}, {"from": "SGUpZ6gd", "to": "JfXbfmPa", "width": 10}, {"from": "SGUpZ6gd", "to": "5yDGjqgE", "width": 10}, {"from": "SGUpZ6gd", "to": "dWs3zrCv", "width": 10}, {"from": "SGUpZ6gd", "to": "7PzeiwdV", "width": 10}, {"from": "SGUpZ6gd", "to": "5viEvD6v", "width": 10}, {"from": "GQdzFiB9", "to": "Co2QwDri", "width": 1}, {"from": "KKvERxRE", "to": "7PzeiwdV", "width": 1}]);

                  }

                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
