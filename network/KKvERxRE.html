                  edges = new vis.DataSet([{"from": "KKvERxRE", "to": "aJeJBesD", "width": 10}, {"from": "KKvERxRE", "to": "6pfzESag", "width": 1}, {"from": "KKvERxRE", "to": "TBYigQyt", "width": 1}, {"from": "KKvERxRE", "to": "YrCfZ8vh", "width": 1}, {"from": "KKvERxRE", "to": "N2xR7adJ", "width": 1}, {"from": "KKvERxRE", "to": "oNLtVNzY", "width": 1}, {"from": "KKvERxRE", "to": "ku2dT5kg", "width": 10}, {"from": "KKvERxRE", "to": "SGUpZ6gd", "width": 1}, {"from": "KKvERxRE", "to": "CpkRues3", "width": 1}, {"from": "KKvERxRE", "to": "dtkJhYLf", "width": 1}, {"from": "KKvERxRE", "to": "7PzeiwdV", "width": 1}, {"from": "KKvERxRE", "to": "ScTqqnFr", "width": 1}, {"from": "KKvERxRE", "to": "C9KemtRC", "width": 1}, {"from": "KKvERxRE", "to": "mu52kCuH", "width": 1}, {"from": "SGUpZ6gd", "to": "7PzeiwdV", "width": 1}, {"from": "aJeJBesD", "to": "7PzeiwdV", "width": 10}, {"from": "6pfzESag", "to": "7PzeiwdV", "width": 1}, {"from": "YrCfZ8vh", "to": "7PzeiwdV", "width": 1}, {"from": "ScTqqnFr", "to": "dtkJhYLf", "width": 1}, {"from": "dtkJhYLf", "to": "7PzeiwdV", "width": 1}, {"from": "ku2dT5kg", "to": "7PzeiwdV", "width": 10}, {"from": "C9KemtRC", "to": "7PzeiwdV", "width": 1}]);

                          if (popupTimeout !== null) {

                          }
                      });

                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
