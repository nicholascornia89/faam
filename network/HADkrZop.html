03cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/dMHW3waJ\u0027\u003eImperial Academy of Medical Surgery\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ehigher educational institution of the Russian Empire for training doctors, mainly for the military and naval departments, corresponding to the medical faculties of universities\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#fffef6", "font": {"color": "#f8f7f4"}, "id": "j8jxKN6U", "label": "organic chemist", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/j8jxKN6U\u0027\u003eorganic chemist\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003echemist specialized in organic chemistry\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "20"}, {"color": "#8b9a66", "font": {"color": "#f8f7f4"}, "id": "Eaco4g5s", "label": "Shusha", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/Eaco4g5s\u0027\u003eShusha\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ecity in Azerbaijan\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "50"}]);
                  edges = new vis.DataSet([{"from": "nt6iNeSy", "to": "DEbEnXwM", "width": 1}, {"from": "nt6iNeSy", "to": "HADkrZop", "width": 1}, {"from": "nt6iNeSy", "to": "UECthgZn", "width": 1}, {"from": "nt6iNeSy", "to": "CuEsY7FX", "width": 1}, {"from": "ZpwbPoZj", "to": "QSZVEcCs", "width": 1}, {"from": "ZpwbPoZj", "to": "HADkrZop", "width": 1}, {"from": "UECthgZn", "to": "HADkrZop", "width": 1}, {"from": "UECthgZn", "to": "aJeJBesD", "width": 10}, {"from": "UECthgZn", "to": "ku2dT5kg", "width": 10}, {"from": "CuEsY7FX", "to": "HADkrZop", "width": 1}, {"from": "CuEsY7FX", "to": "aJeJBesD", "width": 10}, {"from": "CuEsY7FX", "to": "ku2dT5kg", "width": 10}, {"from": "aJeJBesD", "to": "QSZVEcCs", "width": 1}, {"from": "aJeJBesD", "to": "HADkrZop", "width": 1}, {"from": "W4yL2jDA", "to": "HADkrZop", "width": 1}, {"from": "QSZVEcCs", "to": "ku2dT5kg", "width": 1}, {"from": "QSZVEcCs", "to": "DEbEnXwM", "width": 1}, {"from": "QSZVEcCs", "to": "HADkrZop", "width": 1}, {"from": "DEbEnXwM", "to": "6Y3ZcTkG", "width": 1}, {"from": "DEbEnXwM", "to": "dMHW3waJ", "width": 1}, {"from": "DEbEnXwM", "to": "HADkrZop", "width": 1}, {"from": "dMHW3waJ", "to": "HADkrZop", "width": 1}, {"from": "j8jxKN6U", "to": "HADkrZop", "width": 1}, {"from": "6Y3ZcTkG", "to": "HADkrZop", "width": 1}, {"from": "ku2dT5kg", "to": "HADkrZop", "width": 1}, {"from": "Eaco4g5s", "to": "HADkrZop", "width": 1}]);

                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": false}, "smooth": false}, "nodes": {"font": {"size": 14, "align": "center", "face": "sans"}}, "physics": {"forceAtlas2Based": {"gravitationalConstant": -200000000000000, "springLength": 10, "springConstant": 0.001, "avoidOverlap": 1.0, "damping": 0}, "maxVelocity": 1, "minVelocity": 0.25}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
