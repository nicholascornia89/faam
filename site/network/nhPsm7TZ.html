4"}, "id": "PyGNLcfw", "label": "piano", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/PyGNLcfw\u0027\u003epiano\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003emusical keyboard instrument\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "biGnSXZs", "label": "Vincenzo Lavigna", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/biGnSXZs\u0027\u003eVincenzo Lavigna\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eItalian composer\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "TGu5LbY7", "label": "Ferdinando Provesi", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/TGu5LbY7\u0027\u003eFerdinando Provesi\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eItalian composer\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Ferdinando_Provesi,_composer,_musician_and_Verdi\u0027s_teacher.png\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}]);
                  edges = new vis.DataSet([{"from": "TDF2knmi", "to": "nhPsm7TZ", "width": 1}, {"from": "nhPsm7TZ", "to": "aJeJBesD", "width": 10}, {"from": "nhPsm7TZ", "to": "5aTYuVxp", "width": 1}, {"from": "nhPsm7TZ", "to": "YrCfZ8vh", "width": 1}, {"from": "nhPsm7TZ", "to": "7gohDEi3", "width": 1}, {"from": "nhPsm7TZ", "to": "ku2dT5kg", "width": 10}, {"from": "nhPsm7TZ", "to": "kd7Eo5ct", "width": 1}, {"from": "nhPsm7TZ", "to": "Fkfrx6rD", "width": 1}, {"from": "nhPsm7TZ", "to": "TLBzhp5W", "width": 1}, {"from": "nhPsm7TZ", "to": "fj46nffV", "width": 1}, {"from": "nhPsm7TZ", "to": "CBAqGowo", "width": 1}, {"from": "nhPsm7TZ", "to": "PyGNLcfw", "width": 1}, {"from": "nhPsm7TZ", "to": "biGnSXZs", "width": 1}, {"from": "nhPsm7TZ", "to": "TGu5LbY7", "width": 1}, {"from": "fj46nffV", "to": "CBAqGowo", "width": 1}, {"from": "fj46nffV", "to": "TLBzhp5W", "width": 1}, {"from": "aJeJBesD", "to": "biGnSXZs", "width": 1}, {"from": "aJeJBesD", "to": "TGu5LbY7", "width": 10}, {"from": "biGnSXZs", "to": "5aTYuVxp", "width": 1}, {"from": "biGnSXZs", "to": "ku2dT5kg", "width": 1}, {"from": "biGnSXZs", "to": "CBAqGowo", "width": 1}, {"from": "ku2dT5kg", "to": "TGu5LbY7", "width": 10}, {"from": "5aTYuVxp", "to": "TGu5LbY7", "width": 1}]);

                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": false}, "smooth": false}, "nodes": {"font": {"size": 14, "align": "center", "face": "sans"}}, "physics": {"forceAtlas2Based": {"gravitationalConstant": -200000000000000, "springLength": 10, "springConstant": 0.001, "avoidOverlap": 1.0, "damping": 0}, "maxVelocity": 1, "minVelocity": 0.25}};

                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
