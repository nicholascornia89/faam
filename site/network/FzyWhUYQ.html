vier Boisselot", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/GziVRsjy\u0027\u003eXavier Boisselot\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eComposer and piano maker (1811-1893)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/https://upload.wikimedia.org/wikipedia/commons/5/56/Xavier_Boisselot_1861.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "QwSKSFky", "label": "Ferdinand H\u00e9rold", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/QwSKSFky\u0027\u003eFerdinand H\u00e9rold\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFrench composer (1791\u20131833)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Ferdinand_Herold_by_Maurin.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "TLbNgxFk", "label": "Th\u00e9ophile-Adolphe Manoury", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/TLbNgxFk\u0027\u003eTh\u00e9ophile-Adolphe Manoury\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFrench baritone\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Th\u00e9ophile-Adolphe_Manoury.png\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}]);
                  edges = new vis.DataSet([{"from": "GDBksC26", "to": "BJqUa5Kf", "width": 10}, {"from": "GDBksC26", "to": "FzyWhUYQ", "width": 10}, {"from": "FzyWhUYQ", "to": "BJqUa5Kf", "width": 10}, {"from": "FzyWhUYQ", "to": "Cx5HEx8r", "width": 10}, {"from": "FzyWhUYQ", "to": "H7xGj4FE", "width": 10}, {"from": "FzyWhUYQ", "to": "5q9U4tL9", "width": 10}, {"from": "FzyWhUYQ", "to": "7Lv48zWD", "width": 10}, {"from": "FzyWhUYQ", "to": "GziVRsjy", "width": 10}, {"from": "FzyWhUYQ", "to": "QwSKSFky", "width": 10}, {"from": "FzyWhUYQ", "to": "TLbNgxFk", "width": 10}, {"from": "5q9U4tL9", "to": "BJqUa5Kf", "width": 1}, {"from": "Cx5HEx8r", "to": "BJqUa5Kf", "width": 1}, {"from": "GziVRsjy", "to": "BJqUa5Kf", "width": 1}, {"from": "7Lv48zWD", "to": "BJqUa5Kf", "width": 10}, {"from": "BJqUa5Kf", "to": "H7xGj4FE", "width": 10}, {"from": "BJqUa5Kf", "to": "QwSKSFky", "width": 1}, {"from": "BJqUa5Kf", "to": "TLbNgxFk", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": false}, "smooth": false}, "nodes": {"font": {"size": 14, "align": "center", "face": "sans"}}, "physics": {"forceAtlas2Based": {"gravitationalConstant": -200000000000000, "springLength": 10, "springConstant": 0.001, "avoidOverlap": 1.0, "damping": 0}, "maxVelocity": 1, "minVelocity": 0.25}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
