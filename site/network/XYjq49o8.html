ttps://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Charles-Simon_Catel.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "bcZAc7AZ", "label": "Felice Blangini", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/bcZAc7AZ\u0027\u003eFelice Blangini\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eItalian composer (1781-1841)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Felice_Blangini_1820.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "PJTYaiyq", "label": "Talbot", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/PJTYaiyq\u0027\u003eTalbot\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eactor\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Portrait_Talbot.jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "SHxocKpW", "label": "Marie Bigot", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/SHxocKpW\u0027\u003eMarie Bigot\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003eFrench piano teacher\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Marie_Bigot.tiff\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}, {"color": "#d49d33", "font": {"color": "#f8f7f4"}, "id": "bHNYARLV", "label": "Fr\u00e9d\u00e9ric Nicolas Duvernoy", "shape": "dot", "size": 10, "title": "\n\t\t\t\u003cbody\u003e\n\t\t\t\u003ch3\u003e \u003ca href=\u0027https://nicholascornia89.github.io/faam/entity/bHNYARLV\u0027\u003eFr\u00e9d\u00e9ric Nicolas Duvernoy\u003c/a\u003e\u003c/h3\u003e\n\t\t\t\u003cp\u003ecomposer and French horn player (1765-1838)\u003c/p\u003e\u003cimg src=\"https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Portrait_du_corniste_Fr\u00e9d\u00e9ric_Nicolas_Duvernoy_(1765-1838).jpg\" width=\"250\" height=\"200\"\u003e\n\t\t\t\u003c/body\u003e\n\t\t\t", "value": "100"}]);
                  edges = new vis.DataSet([{"from": "Mj6zznNc", "to": "BJqUa5Kf", "width": 10}, {"from": "Mj6zznNc", "to": "XYjq49o8", "width": 10}, {"from": "XYjq49o8", "to": "BJqUa5Kf", "width": 10}, {"from": "XYjq49o8", "to": "mwTt9mNa", "width": 10}, {"from": "XYjq49o8", "to": "jzsis3MS", "width": 10}, {"from": "XYjq49o8", "to": "Y7stG82h", "width": 10}, {"from": "XYjq49o8", "to": "JpmcYb8F", "width": 10}, {"from": "XYjq49o8", "to": "bcZAc7AZ", "width": 10}, {"from": "XYjq49o8", "to": "PJTYaiyq", "width": 10}, {"from": "XYjq49o8", "to": "SHxocKpW", "width": 10}, {"from": "XYjq49o8", "to": "bHNYARLV", "width": 10}, {"from": "JpmcYb8F", "to": "BJqUa5Kf", "width": 1}, {"from": "SHxocKpW", "to": "BJqUa5Kf", "width": 1}, {"from": "mwTt9mNa", "to": "BJqUa5Kf", "width": 1}, {"from": "jzsis3MS", "to": "BJqUa5Kf", "width": 1}, {"from": "bcZAc7AZ", "to": "BJqUa5Kf", "width": 1}, {"from": "PJTYaiyq", "to": "BJqUa5Kf", "width": 10}, {"from": "bHNYARLV", "to": "BJqUa5Kf", "width": 10}, {"from": "BJqUa5Kf", "to": "Y7stG82h", "width": 10}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"configure": {"enabled": false}, "edges": {"color": {"inherit": false}, "smooth": false}, "nodes": {"font": {"size": 14, "align": "center", "face": "sans"}}, "physics": {"forceAtlas2Based": {"gravitationalConstant": -200000000000000, "springLength": 10, "springConstant": 0.001, "avoidOverlap": 1.0, "damping": 0}, "maxVelocity": 1, "minVelocity": 0.25}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
